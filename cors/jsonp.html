<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>jsonp</title>
</head>
<body>
	<button>请求数据</button>
	<script type="text/javascript">

				mode: "cors"
			})
		})
	</script>
</body>
</html>
