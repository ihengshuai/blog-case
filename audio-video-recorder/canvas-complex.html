<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    canvas {
      max-width: 100vw;
    }
  </style>
</head>

<body>
  <button>获取用户设备</button>
  <button id="toggleVideo">开/关摄像头</button>
  <button id="stop">停止</button>
  <button id="recorder">录制</button>
  <!-- <video src="/public/xiamen.mp4" id="xiamen-video"></video> -->

  <script>
    const btn = document.querySelector('button');
    const toggleVideo = document.getElementById('toggleVideo');
    const stop = document.getElementById('stop');
    const xiamenVideo = document.getElementById('xiamen-video');
    const recorderBtn = document.getElementById('recorder');

    let mediaStream;
    let screenStream;
    let video;
    let screen;
    let canvas;
    let combinedStream;
    let recording = false;

    const bufferChunks = [];

    btn.addEventListener('click', getUserMedia);
    toggleVideo.addEventListener('click', toggleVideoStream);
    stop.addEventListener('click', stopStream);
    recorderBtn.addEventListener('click', record);

    async function getUserMedia() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });

        screenStream = await navigator.mediaDevices.getDisplayMedia({
          video: { cursor: "always", frameRate: 3, width: 1920 },
          audio: true
        });


        video = document.createElement('video');
        video.srcObject = mediaStream;
        video.play();

        screen = document.createElement('video');
        screen.srcObject = screenStream;
        screen.play();

        drawStream();
      } catch (error) {
        console.log(error);
        console.dir(error)
        if (error.name === 'NotAllowedError') {
          console.log('用户拒绝了访问设备');
        }
      }
    }

    function toggleVideoStream() {
      if (!mediaStream) return;
      for (const track of mediaStream.getVideoTracks()) {
        track.enabled = !track.enabled;
      }
    }


    function stopStream() {
      if (mediaStream) {
        for (const track of mediaStream.getTracks()) {
          track.stop();
        }
      }

      if (screenStream) {
        for (const track of screenStream.getTracks()) {
          track.stop();
        }
      }

      video && video.remove();
      screen && screen.remove();
      canvas && canvas.remove();
      recorder && recorder.stop();
    }

    function drawStream() {
      canvas = document.createElement('canvas');

      const videoTrack = screenStream.getVideoTracks()[0];
      const { width, height } = videoTrack.getSettings();

      const aspectRatio = width / height;

      canvas.width = 800;
      canvas.height = canvas.width / aspectRatio;

      document.body.appendChild(canvas);
      const ctx = canvas.getContext('2d');

      // 渲染圆形人像
      const offScreenCanvas = document.createElement('canvas');
      const offScreenCanvasSize = 400 / aspectRatio;
      offScreenCanvas.width = offScreenCanvas.height = offScreenCanvasSize;
      const offCtx = offScreenCanvas.getContext('2d');
      offCtx.beginPath();
      offCtx.arc(offScreenCanvasSize / 2, offScreenCanvasSize / 2, offScreenCanvasSize / 2, 0, Math.PI * 2);
      offCtx.clip();

      draw();

      function draw() {
        ctx.drawImage(screen, 0, 0, 800, canvas.width / aspectRatio);

        offCtx.drawImage(video, video.width / 2, video.height / 2, offScreenCanvasSize, offScreenCanvasSize);
        ctx.drawImage(offScreenCanvas, canvas.width - offScreenCanvasSize - 10, canvas.height - offScreenCanvasSize - 10);
        // ctx.drawImage(video, canvas.width - 200 - 10, canvas.height - offScreenCanvasSize - 10, 200, 100);

        requestAnimationFrame(draw);
      }
    }

    function record() {
      if (!mediaStream) return;
      if (recording) {
        recorder.stop();
        recording = false;

        

        return;
      }

      if (!recording) {
        recording = true;
      }
      combinedStream = canvas.captureStream();
      recorder = new MediaRecorder(combinedStream, {
        mimeType: 'video/webm; codecs=vp9'
      });
      combinedStream.addTrack(mediaStream.getAudioTracks()[0]);
      if (!!screenStream.getAudioTracks().length) {
        combinedStream.addTrack(screenStream.getAudioTracks()[0]);
      }

      recorder.start(30);

      recorder.ondataavailable = function (e) {
        console.log('data available', e.data);
        bufferChunks.push(e.data);
      };

      recorder.onstop = function (e) {
        // 生成视频链接
        const blob = new Blob(bufferChunks, { type: "video/webm;codecs=h264" });
        bufferChunks.length = 0;
        const link = URL.createObjectURL(blob);
        console.log(link);
        
        window.open(link, "_blank");
      };
    }

    async function sleep(ms = 1000) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
  </script>
</body>

</html>
