<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Range</title>
</head>

<body>
  <button class="range">range请求</button>
  <a href="/range">下载</a>
  <br>
  <script>
    function $(str) {
      return document.querySelector(str);
    }

    $(".range").addEventListener("click", async () => {
      fetch("/range", { headers: { "Range": "bytes=100-" } });
    })
  </script>
</body>

</html>
